<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1530" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Aula360</title>
    <!--
      Aplica el tema guardado antes de pintar (sin parpadeo). Debe coincidir con
      src/theme/theme.ts. En producción, su hash va en la CSP (script-src).
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('aula360.theme');
          var dark =
            pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
